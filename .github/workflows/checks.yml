name: Validate ADPHOR
on:
  pull_request:
  push:
    branches: [main, qa/integral-claude-reviewed-20261111]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node qa/porto/test-persistence.mjs
      - run: node qa/checks/build-isolation.mjs
      - run: npm run build
      - name: Compile Cloudflare Pages Functions (no deployment)
        run: npm exec --yes --package=wrangler@4.157.0 -- wrangler pages functions build functions --outdir=/tmp/adphor-pages-functions-build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            test-results/
            qa/visual-premium/

  qa-python-worker-package:
    name: Python Worker QA offline package
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: Validate private QA Worker configuration
        run: python qa/security/validate_private_worker.py
      - name: Build Python QA Worker bundle without deployment
        working-directory: backend
        env:
          CI: 'true'
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
        run: uv run --frozen pywrangler deploy --config wrangler.qa.jsonc --dry-run --outdir=/tmp/adphor-ai-qa-worker

  bootstrap-private-qa-worker:
    name: Bootstrap disabled private QA Worker (one-time)
    needs: [test, python-tests, qa-python-worker-package]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/qa/integral-claude-reviewed-20261111' &&
      contains(github.event.head_commit.message, '[ADPHOR_PRIVATE_QA_BOOTSTRAP_20261117]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: adphor-qa
    concurrency:
      group: adphor-private-qa-worker-bootstrap
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_QA_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ADPHOR_QA_URL: ${{ vars.ADPHOR_QA_URL }}
      CI: 'true'
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: Assert destination and nonexistence of QA Worker
        run: node qa/security/private-worker-bootstrap.mjs preflight
      - name: Revalidate isolated disabled Worker configuration
        run: python qa/security/validate_private_worker.py
      - name: Upload ONLY the disabled private QA Python Worker
        working-directory: backend
        run: uv run --frozen pywrangler deploy --config wrangler.qa.jsonc
      - name: Verify no public workers.dev subdomain and exact target
        run: node qa/security/private-worker-bootstrap.mjs postflight

  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-fastapi.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-fastapi.txt
      - name: Run Python tests
        run: PYTHONPATH=backend/src python -m unittest discover -s backend/tests -v
      - name: Compile Python modules
        run: python -m compileall -q backend/src

